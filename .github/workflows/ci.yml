name: CI

on:
  push:
    branches: [main, arena/*]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
        env:
          APP_SECRET: ci-secret
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
